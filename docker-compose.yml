services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    container_name: sat_master_postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satbot -d sat_master"]
      interval: 5s
      timeout: 5s
      retries: 10

  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.bridge
    container_name: sat_master_bridge
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      BORE_SERVER: bore.pub
      RENDER_APP_URL: https://sat-master-bot.onrender.com
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sat_pgdata:
